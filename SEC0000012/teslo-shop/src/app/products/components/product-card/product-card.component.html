<div class="card card-compact bg-base-100 shadow-xl p-2 animate-fadeIn">
  <figure>
    <img
      src="https://img.daisyui.com/images/stock/photo-1606107557195-0e29a4b5b4aa.webp"
      alt="Shoes" />
  </figure>
  <div class="card-body">
    <h2 class="card-title"> {{title()}}</h2>
    {{description() | truncate }}
    <div class="card-actions justify-end">
      <a class="btn btn-primary animate-wiggle" [routerLink]="['/product',id()]">Buy Now</a>
    </div>
  </div>
</div>
