<form class="space-y-4 w-full max-w-md mx-auto mt-10">

  <!-- Nombre de usuario -->
  <label class="input input-bordered flex items-center gap-2">
    <svg class="h-[1em] w-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" fill="none"
         viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5.121 17.804A9.001 9.001 0 0112 15c2.21 0 4.22.805 5.879 2.137M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
    </svg>
    <input type="text" placeholder="Username" class="grow" required />
  </label>

  <!-- Email -->
  <label class="input input-bordered flex items-center gap-2">
    <svg class="h-[1em] w-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" fill="none"
         viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 12l-4-4-4 4m0 0l4 4m-4-4h8" />
    </svg>
    <input type="email" placeholder="Email" class="grow" required />
  </label>

  <!-- Contraseña -->
  <label class="input input-bordered flex items-center gap-2">
    <svg class="h-[1em] w-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" fill="none"
         viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 15v2m0 4h.01M17 8a5 5 0 00-10 0v4H5a2 2 0 002 2h10a2 2 0 002-2h-2V8z" />
    </svg>
    <input type="password" placeholder="Password" class="grow" required />
  </label>

  <!-- Confirmar Contraseña -->
  <label class="input input-bordered flex items-center gap-2">
    <svg class="h-[1em] w-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" fill="none"
         viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 15v2m0 4h.01M17 8a5 5 0 00-10 0v4H5a2 2 0 002 2h10a2 2 0 002-2h-2V8z" />
    </svg>
    <input type="password" placeholder="Confirm Password" class="grow" required />
  </label>

  <!-- Botón -->
  <button type="submit" class="btn btn-primary w-full">
    Create Account
  </button>

  <!-- Link alternativo -->
  <div class="text-center text-sm text-gray-500 mt-2">
    Already have an account? <a routerLink="/auth" class="link">Login</a>
  </div>
</form>
