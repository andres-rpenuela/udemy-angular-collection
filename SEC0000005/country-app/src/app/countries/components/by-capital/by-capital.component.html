<!-- Country Search Input -->
<section class="flex flex-row gap-2 mt-2">
  <input
    type="text"
    class="input input-bordered mr-2 w-56"
    placeholder="Buscar por capital"
    autofocus
    #inputCapital
    (keyup)="onDeBounce(inputCapital.value)"
  >
  <!--
      (keyup.enter)="onSearch(inputCapital.value)"
    >
  -->

  <button class="btn btn-primary" (click)="onSearch(inputCapital.value)">Buscar</button>
</section>

<!-- Country table -->
<section class="mt-5">
  <table class="table table-md mt-2 w-full">
    <thead>
    <tr>
      <th>#</th>
      <th>Icono</th>
      <th>Bandera</th>
      <th>Nombre</th>
      <th>Capital</th>
      <th>Poblacion</th>
      <th></th>
    </tr>
    </thead>
    <tbody>
    <tr>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
    </tr>
    </tbody>
  </table>
</section>
