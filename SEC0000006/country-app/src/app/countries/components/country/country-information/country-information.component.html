<section class="stats shadow">
  <div class="stat place-items-center">
    <div class="stat-title">Poblacion</div>
    <div class="stat-value">{{ countryData().population | number }}</div>
    <div class="stat-desc">Desde {{ currentYear() }}</div>
  </div>

  <div class="stat place-items-center">
    <div class="stat-title">Nombre</div>
    <div class="stat-value text-secondary">{{  countryData().name }}</div>
    <div class="stat-desc text-secondary">↗ {{  countryData().region }} </div>
  </div>

  <div class="stat place-items-center">
    <div class="stat-title">Sub region</div>
    <div class="stat-value">{{ countryData().subRegion }}</div>
    <div class="stat-desc">↘︎ {{  countryData().cca2 }}</div>
  </div>

  <div class="stat place-items-center">
    <div class="stat-title">Bandera</div>
    <div class="stat-value">  <img height="100" width="100" [src]="  countryData().flagUrl "/> </div>
    <div class="stat-desc">↘︎ {{  countryData().cca2 }}</div>
  </div>
</section>

<section class="diff aspect-16/9" tabindex="0">
  <div class="diff-item-1" role="img" tabindex="0">
    <img class="blur brightness-75" [alt]="countryData().name" [src]="countryData().flagUrl" />
  </div>
  <div class="diff-item-2" role="img">
    <img
      [alt]="countryData().name" [src]="countryData().flagUrl" />
  </div>
  <div class="diff-resizer"></div>
</section>
