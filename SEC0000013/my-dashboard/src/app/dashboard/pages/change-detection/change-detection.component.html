<shared-title [title]="'Change Detection'"></shared-title>

<div class="w-full max-w-4xl mx-auto space-y-6 p-4 sm:p-6 md:p-8 bg-white shadow-md rounded-xl">

  <!-- Explicación -->
  <div>
    <label class="block text-gray-700 font-semibold mb-2">Explicación:</label>
    <textarea
      class="w-full p-3 border border-gray-300 rounded-lg resize-none bg-gray-50 text-sm text-gray-800"
      rows="4"
      readonly
    >
Usar ChangeDetectionStrategy.OnPush o ChangeDetectionStrategy.Default, y comprobar que signal cambia con OnPush y Default, mientras que frameworkProperty solo lo hará por defecto o si forzamos la detección.
    </textarea>
  </div>

  <!-- Property Section -->
  <div>
    <h2 class="text-xl font-bold text-blue-700 mb-2">Property</h2>
    <pre class="w-full bg-gray-100 p-4 rounded-lg border border-gray-200 text-sm text-gray-800 overflow-auto">
{{ frameworkProperty | json }}
    </pre>
  </div>

  <hr class="border-t border-gray-300 my-4">

  <!-- Signal Section -->
  <div>
    <h2 class="text-xl font-bold text-green-700 mb-2">Signal</h2>
    <pre class="w-full bg-gray-100 p-4 rounded-lg border border-gray-200 text-sm text-gray-800 overflow-auto">
{{ frameworkSignal() | json }}
    </pre>
  </div>

</div>
