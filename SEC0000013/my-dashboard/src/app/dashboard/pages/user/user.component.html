<shared-title [title]="fullName()"></shared-title>

@if(user()){
  <section class="flex justify-start">
      <img [srcset]="user()!.avatar" [alt]="user()!.first_name" class="rounded w-14"/>

      <div class="mx-5 ">
        <h3>{{ user()!.first_name }} {{ user()!.last_name }} </h3>
        <h3>{{ user()!.email }}</h3>
      </div>
  </section>
}@else{
  <p>Cargando Informacion o no encontrado</p>
}
