<div #map class="h-[calc(100vh-64px)] w-full"></div>
<div class="zoom-view">
  <div class="zoom-view-content">
    <h2 class="text-2xl font-bold text-black mb-2">Zoom Level
      <small class="text-gray-500 font-normal"> {{ zoom() | number:'1.0-2' }}</small>
    </h2>
    <data value="zoom-view-value">
      <input type="range" min="1" max="14"
             [value]="this.zoom()"
             (input)="this.zoom.set(+zoomRange.value)"
             class="range range-info"
             #zoomRange/>
    </data>
    <h2 class="text-2xl font-bold text-black mb-2">Center Coordinates
    </h2>
    <pre class="text-sm text-gray-500 font-normal">{{
        {
          Lat: coordinates().lat | number:'1.0-4',
          Long: coordinates().lng | number:'1.0-4'
        } | json }}
    </pre>
  </div>
</div>
